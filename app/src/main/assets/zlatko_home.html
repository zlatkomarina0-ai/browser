<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ZLATKO Browser</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#1a222d;--line:#2b3948;--text:#f4f7fb;--muted:#a7b5c5;--accent:#70d69a}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b3440 0,#10141b 58%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
main{width:min(680px,100%)}.brand{text-align:center;margin-bottom:28px}.mark{display:inline-grid;place-items:center;width:68px;height:68px;border-radius:22px;background:var(--accent);color:#102018;font-size:30px;font-weight:900;box-shadow:0 12px 40px #70d69a30}.brand h1{font-size:clamp(30px,7vw,46px);letter-spacing:2px;margin:14px 0 4px}.brand p{color:var(--muted);margin:0}.search{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px;margin:0 auto 24px;box-shadow:0 14px 40px #0003}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);padding:12px;font:inherit}.search button{border:0;border-radius:11px;background:var(--accent);color:#102018;font-weight:750;padding:0 18px;font:inherit;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{display:block;text-decoration:none;color:var(--text);background:#1a222ddd;border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.98)}.tile b{display:block;margin-bottom:5px}.tile span{font-size:13px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:28px}@media(min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<header class="brand"><div class="mark">Z</div><h1>ZLATKO</h1><p>Browser · Brz pristap do webot</p></header>
<form class="search" action="https://www.google.com/search" method="get"><input name="q" type="search" placeholder="Prebaraj internet ili vnesi poim..." aria-label="Search the web" autofocus><button type="submit">Baraj</button></form>
<section class="grid" aria-label="Quick links">
<a class="tile" href="https://www.google.com/"><b>Google</b><span>Prebaruvanje</span></a>
<a class="tile" href="https://www.youtube.com/"><b>YouTube</b><span>Video</span></a>
<a class="tile" href="https://www.wikipedia.org/"><b>Wikipedia</b><span>Enciklopedija</span></a>
<a class="tile" href="https://github.com/"><b>GitHub</b><span>Proekti i kod</span></a>
</section>
<footer>ZLATKO Browser · Lokalna početna stranica</footer>
</main>
</body>
</html>
