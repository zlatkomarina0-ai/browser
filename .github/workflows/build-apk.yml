name: Build ZLATKO Browser APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Current Android command-line tools require Java 17.
      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-29" "build-tools;28.0.3"

      # This legacy project uses Gradle 5.4.1 / Android Gradle Plugin 3.5.2,
      # so run the build with Java 8 rather than Java 17.
      - name: Set up Java 8 for Gradle build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZLATKO-Browser-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
